server.port=8080
# Só aceita conexões da própria máquina. Para expor (ex.: container), troque conscientemente
# e coloque um proxy reverso com HTTPS na frente.
server.address=127.0.0.1

# H2 (em memória)
spring.datasource.url=jdbc:h2:mem:payrolldb
spring.datasource.driver-class-name=org.h2.Driver
spring.datasource.username=sa
spring.datasource.password=

# JPA
spring.jpa.hibernate.ddl-auto=create-drop
# SQL fora do log por padrão (os logs de SQL mostram dados). Para depurar localmente, descomente:
# logging.level.org.hibernate.SQL=debug
spring.jpa.show-sql=false

# H2 Console desligado por padrão. Para ligar só na sua máquina, use
# spring.h2.console.enabled=true (ou -Dspring.h2.console.enabled=true). Como todas as rotas exigem
# autenticação e o X-Frame-Options padrão é DENY, o console só carrega depois de ajustar o
# SecurityConfig (headers.frameOptions sameOrigin). Não ligue fora de ambiente local.
spring.h2.console.enabled=false
spring.h2.console.path=/h2-console

# Garante leitura do import.sql em UTF-8 (acentos e travessão nos nomes)
spring.jpa.properties.hibernate.hbm2ddl.charset_name=UTF-8
