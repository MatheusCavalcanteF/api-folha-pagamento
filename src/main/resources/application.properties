spring.application.name=api-folha-pagamento
spring.profiles.active=dev

# Autenticação (HTTP Basic)
spring.security.user.name=${APP_USER:analista}
# Sem default no código: se APP_PASSWORD não existir, o Spring Boot gera uma senha aleatória
# e a imprime no log de inicialização ("Using generated security password").
spring.security.user.password=${APP_PASSWORD:}
